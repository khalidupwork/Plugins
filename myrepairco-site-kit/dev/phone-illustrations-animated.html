<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:transparent;font-family:Montserrat,Arial,sans-serif}svg{display:block}text{font-family:Montserrat,Arial,sans-serif}</style></head><body>
<svg id="tracking" width="560" height="640" viewBox="0 0 560 640" xmlns="http://www.w3.org/2000/svg">
  <circle cx="280" cy="350" r="250" fill="#F9D9D5"/>
  <circle cx="280" cy="350" r="250" fill="none" stroke="#C62828" stroke-width="5" stroke-dasharray="26 22"/>
  <g transform="rotate(-6 280 330)">
    <rect x="150" y="40" width="260" height="540" rx="38" fill="#1B1B1F"/>
    <clipPath id="scr"><rect x="162" y="52" width="236" height="516" rx="28"/></clipPath>
    <g clip-path="url(#scr)">
      <rect x="162" y="52" width="236" height="516" fill="#ECEFF1"/>
      <path d="M162 150 Q260 180 398 120 L398 52 L162 52Z" fill="#BFE3F2"/>
      <rect x="300" y="330" width="80" height="60" rx="8" fill="#CDEBC8"/>
      <rect x="175" y="230" width="60" height="45" rx="8" fill="#CDEBC8"/>
      <g stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round">
        <path d="M150 210 L410 260"/><path d="M230 52 L260 568"/><path d="M150 420 L410 380"/><path d="M340 52 L320 568"/>
      </g>
      <g stroke="#F6C343" stroke-width="5" fill="none"><path d="M150 210 L410 260"/></g>
      <path id="route" d="M215 175 C240 260 300 300 330 420" stroke="#C62828" stroke-width="6" fill="none" stroke-dasharray="12 9" stroke-linecap="round"/>
      <g id="van" transform="translate(215 175)"><circle r="24" fill="#C62828"/><circle r="24" fill="none" stroke="#fff" stroke-width="4"/>
        <rect x="-12" y="-6" width="24" height="12" rx="3" fill="#fff"/><circle cx="-7" cy="8" r="3.5" fill="#fff"/><circle cx="7" cy="8" r="3.5" fill="#fff"/></g>
      <circle id="pulse" cx="330" cy="420" r="10" fill="#C62828" opacity=".25"/><g transform="translate(330 420)"><path d="M0 0 C-22 -26 -22 -52 0 -60 C22 -52 22 -26 0 0Z" fill="#1B1B1F"/>
        <path d="M-10 -30 L0 -40 L10 -30 L10 -20 L-10 -20Z" fill="#fff"/></g>
      <rect x="162" y="52" width="236" height="44" fill="#C62828"/>
      <text x="280" y="81" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Live Tracking</text>
      <rect x="174" y="448" width="212" height="108" rx="16" fill="#fff"/>
      <circle cx="206" cy="482" r="20" fill="#F2B8A2"/><path d="M190 476 Q206 456 222 476Z" fill="#C62828"/>
      <text x="236" y="478" fill="#1B1B1F" font-size="13" font-weight="800">Mike R.</text>
      <text x="236" y="496" fill="#2E7D32" font-size="10.5" font-weight="700">✔ Background verified</text>
      <text id="lbl" x="186" y="526" fill="#4A4A4A" font-size="11" font-weight="500">Arriving in</text>
      <text id="eta" x="262" y="527" fill="#C62828" font-size="15" font-weight="800">12 min</text>
      <rect x="186" y="536" width="188" height="8" rx="4" fill="#EEE"/><rect id="bar" x="186" y="536" width="128" height="8" rx="4" fill="#C62828"/>
    </g>
    <rect x="245" y="58" width="70" height="10" rx="5" fill="#1B1B1F"/>
  </g>
</svg>
<svg id="booking" width="560" height="640" viewBox="0 0 560 640" xmlns="http://www.w3.org/2000/svg">
  <circle cx="280" cy="350" r="250" fill="#F9D9D5"/>
  <g transform="rotate(5 280 330)">
    <rect x="150" y="40" width="260" height="540" rx="38" fill="#1B1B1F"/>
    <rect x="162" y="52" width="236" height="516" rx="28" fill="#fff"/>
    <rect x="162" y="52" width="236" height="96" rx="28" fill="#C62828"/><rect x="162" y="110" width="236" height="38" fill="#C62828"/>
    <text x="182" y="100" fill="#fff" font-size="13" font-weight="500">Hi there 👋</text>
    <text x="182" y="126" fill="#fff" font-size="16" font-weight="800">What needs fixing?</text>
    <g font-size="11" font-weight="700" fill="#1B1B1F" text-anchor="middle">
      <g transform="translate(182 168)"><rect class="tile" width="96" height="80" rx="14" fill="#FBE9E7" stroke="#C62828" stroke-width="0"/><circle cx="48" cy="30" r="16" fill="#C62828"/><text x="48" y="66">Plumbing</text></g>
      <g transform="translate(286 168)"><rect class="tile" width="96" height="80" rx="14" fill="#FBE9E7" stroke="#C62828" stroke-width="0"/><circle cx="48" cy="30" r="16" fill="#C62828"/><text x="48" y="66">Electrical</text></g>
      <g transform="translate(182 258)"><rect class="tile" width="96" height="80" rx="14" fill="#FBE9E7" stroke="#C62828" stroke-width="0"/><circle cx="48" cy="30" r="16" fill="#C62828"/><text x="48" y="66">Handyman</text></g>
      <g transform="translate(286 258)"><rect class="tile" width="96" height="80" rx="14" fill="#FBE9E7" stroke="#C62828" stroke-width="0"/><circle cx="48" cy="30" r="16" fill="#C62828"/><text x="48" y="66">Appliances</text></g>
    </g>
    <g fill="#fff" font-size="16" font-weight="800" text-anchor="middle">
      <text x="230" y="204">🔧</text><text x="334" y="204">⚡</text><text x="230" y="294">🔨</text><text x="334" y="294">⚙️</text></g>
    <text x="182" y="370" fill="#1B1B1F" font-size="12" font-weight="800">When?</text>
    <rect x="182" y="380" width="96" height="34" rx="17" fill="#C62828"/><text x="230" y="402" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Today</text>
    <rect x="286" y="380" width="96" height="34" rx="17" fill="#fff" stroke="#DDD" stroke-width="2"/><text x="334" y="402" text-anchor="middle" fill="#4A4A4A" font-size="11" font-weight="700">Pick a time</text>
    <rect x="182" y="430" width="200" height="56" rx="14" fill="#F4F4F4"/>
    <text x="196" y="453" fill="#4A4A4A" font-size="10.5" font-weight="500">Leaky kitchen faucet,</text>
    <text x="196" y="470" fill="#4A4A4A" font-size="10.5" font-weight="500">dripping under the sink…</text>
    <g id="btn" style="transform-origin:282px 527px"><rect x="182" y="504" width="200" height="46" rx="23" fill="#C62828"/>
    <text x="282" y="533" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">Book a Tech</text></g><circle id="tap" cx="300" cy="527" r="0" fill="#fff" opacity="0"/>
    <rect x="245" y="58" width="70" height="10" rx="5" fill="#000" opacity=".35"/>
  </g>
</svg>
<script>
const route=document.getElementById('route'), L=route.getTotalLength();
function frame(t){
  const e=t<.85? t/.85 : 1, p=route.getPointAtLength(L*e*.82);
  document.getElementById('van').setAttribute('transform',`translate(${p.x} ${p.y})`);
  route.style.strokeDashoffset=-t*84;
  document.getElementById('eta').textContent=(t<.85? Math.max(1,Math.round(12-11*e))+' min':'here!');document.getElementById('lbl').textContent=(t<.85?'Arriving in':'Your tech is');
  document.getElementById('bar').setAttribute('width',(40+148*e).toFixed(1));
  const k=(t*3)%1, pu=document.getElementById('pulse'); pu.setAttribute('r',10+28*k); pu.setAttribute('opacity',(.35*(1-k)).toFixed(3));
  const active=Math.floor(t*5);
  document.querySelectorAll('.tile').forEach((r,i)=>{r.setAttribute('stroke-width', i===active?3:0); r.setAttribute('fill', i===active?'#F8D3CE':'#FBE9E7');});
  const b=t>=.8? (t-.8)/.2 : 0, sc=b? 1-.06*Math.sin(Math.PI*Math.min(1,b*2)) : 1;
  document.getElementById('btn').style.transform=`scale(${sc})`;
  const tap=document.getElementById('tap'); tap.setAttribute('r', b? 6+40*b:0); tap.setAttribute('opacity', b? (.55*(1-b)).toFixed(3):0);
}
</script></body></html>
